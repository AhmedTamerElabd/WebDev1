<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greet & Goodbye Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 300px;
        }
        #title {
            margin-top: 0;
            color: #333;
        }
        .input-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #d4edda;
            color: #155724;
            margin: 5px 0;
            padding: 10px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        li:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }
        li.goodbye {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Welcome</h1>
        <div class="input-area">
            <input id="name" placeholder="Your name" />
            <button id="greet">Greet</button>
        </div>
        <ul id="list"></ul>
    </div>

    <script>
        const nameInput = document.getElementById('name');
        const greetBtn = document.getElementById('greet');
        const list = document.getElementById('list');

        function addGreeting() {
            const name = nameInput.value.trim();
            if (name) {
                const li = document.createElement('li');
                li.textContent = `Hello, ${name}! 👋 `;
                
                li.addEventListener('click', () => {
                    if (!li.classList.contains('goodbye')) {
                        li.textContent = `Goodbye, ${name}! 👋`;
                        li.classList.add('goodbye');
                    } else {
                        // Optional: remove item if clicked again after Goodbye
                        li.remove();
                    }
                });

                list.appendChild(li);
                nameInput.value = '';
            }
        }

        greetBtn.addEventListener('click', addGreeting);

        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addGreeting();
        });
    </script>
</body>
</html>
